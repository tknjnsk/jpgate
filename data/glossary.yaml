"アクリルキーホルダー": "Acrylic Keychain"
"缶バッジ": "Can Badge"
"扇子": "Folding Fan"
# 解体匠機と同じく、英語圏でもそのまま呼ばれている製法名。訳さない。
"真骨彫製法": "Shinkocchou Seihou"
"キーホルダー": "Keychain"
"フォトフレーム": "Photo Frame"
# 商品名に出るのは「何であるか」なので Capsule Toy を採る（英語話者なら
# コレクターでなくても読める）。**検索されるほうの綴り `Gashapon` は
# ハッシュタグで拾う**——商品名は理解のため、タグは探索のため、と役割が違う。
# `clip._TOPIC_TAGS` に対応する組がある。
"カプセルトイ": "Capsule Toy"
# 「受注生産」は既にある。角括弧の中に単独で出る形が未登録だった。
"受注": "Made-to-Order"
# 借用語をそのまま戻すだけのもの。綴りの判断が要らない（カプセルトイや
# モンコレのように「公式表記と検索される綴りが違う」問題が起きない）。
"コレクション": "Collection"
"パッケージ": "Package"
"カートリッジ": "Cartridge"

