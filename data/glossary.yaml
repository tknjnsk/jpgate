# --- ポケモンセンター ---
#
# 掲載439件のうち99件に「ポケモン」が入っていた。ここが空だったせいで
# ポケセンの商品はほぼ全部が日本語のまま出ていた（訳出率50%以上は18%）。
#
# 綴りは公式表記ではなく検索される綴りを採る。`Pokémon` ではなく `Pokemon`
# （アクセント記号付きは eBay でも TikTok でも打たれない）。
"ポケモンセンター": "Pokemon Center"
"ポケモン": "Pokemon"
"イーブイ": "Eevee"
"ゲンガー": "Gengar"
"ヤドン": "Slowpoke"
# 拡張パックより先に当てる必要があるが、Glossary が長いキーから当てるので
# 並び順は効かない（`強化拡張パック` のほうが長い）。
"強化拡張パック": "Enhanced Expansion Pack"
"拡張パック": "Expansion Pack"
# ポケモンセンター公式の英語名。北米の口語では Deck Box とも呼ぶ。
"デッキケース": "Deck Case"
"デッキシールド": "Card Sleeves"
"スカーレット": "Scarlet"
"バイオレット": "Violet"
# タカラトミーの英語ブランド名。説明的な "Monster Collection" ではなく
# 商品に刷ってあるほうを採る。
"モンコレ": "Moncolle"

# --- グッズの種別 ---
# 商品名の主語になる語。これが日本語のままだと「何なのか」が伝わらない。
"ぬいぐるみ": "Plush"
"アクリルキーホルダー": "Acrylic Keychain"
"缶バッジ": "Can Badge"
"扇子": "Folding Fan"
# 解体匠機と同じく、英語圏でもそのまま呼ばれている製法名。訳さない。
"真骨彫製法": "Shinkocchou Seihou"
"キーホルダー": "Keychain"
"フォトフレーム": "Photo Frame"
# 商品名に出るのは「何であるか」なので Capsule Toy を採る（英語話者なら
# コレクターでなくても読める）。**検索されるほうの綴り `Gashapon` は
# ハッシュタグで拾う**——商品名は理解のため、タグは探索のため、と役割が違う。
# `clip._TOPIC_TAGS` に対応する組がある。
"カプセルトイ": "Capsule Toy"
# 「受注生産」は既にある。角括弧の中に単独で出る形が未登録だった。
"受注": "Made-to-Order"
# 借用語をそのまま戻すだけのもの。綴りの判断が要らない（カプセルトイや
# モンコレのように「公式表記と検索される綴りが違う」問題が起きない）。
"コレクション": "Collection"
"パッケージ": "Package"
"カートリッジ": "Cartridge"

