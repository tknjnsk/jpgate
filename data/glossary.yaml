#
# 掲載439件のうち99件に「ポケモン」が入っていた。ここが空だったせいで
# ポケセンの商品はほぼ全部が日本語のまま出ていた（訳出率50%以上は18%）。
#
# 綴りは公式表記ではなく検索される綴りを採る。`Pokémon` ではなく `Pokemon`
# （アクセント記号付きは eBay でも TikTok でも打たれない）。
