# 拡張パックより先に当てる必要があるが、Glossary が長いキーから当てるので
# 並び順は効かない（`強化拡張パック` のほうが長い）。
"強化拡張パック": "Enhanced Expansion Pack"
"拡張パック": "Expansion Pack"
