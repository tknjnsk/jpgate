# JPGate 設定
#
# 秘密（Discord Webhook）はここに書かない。環境変数 JPGATE_DISCORD_WEBHOOK。

business:
  brand_name: "JPGate"
  # 通知とWebページのCTAリンク。代行の申し込み導線。
  # 有効期限なし・使用回数無制限で発行済み（2026-08-18 API で確認）。
  # サイトとX投稿に埋め込まれるので、**このリンクは変更しないこと**。
  contact_url: "https://discord.gg/fZutAxwg3f"
  # 独自ドメイン。設定すると docs/CNAME を書き出して GitHub Pages に当たる。
  # 空のあいだは <user>.github.io/<repo>/ で公開される。
  custom_domain: "jpgate.net"
  # 公開URL。og:image は絶対URLでないと無視されるので、独自ドメインに
  # 移すときはここも必ず変えること。
  site_url: "https://jpgate.net"

# --------------------------------------------------------------------------
# アクセス解析。どちらも Cookie を使わないので同意バナーが要らない。
# 空のあいだタグは1行も出ない。Amazon アソシエイトの申請前提でもある
# (流入が測れないまま申請すると180日の締切を自分で起動することになる)。
#
#   Cloudflare : ダッシュボード → Web Analytics → サイト追加 → token をコピー
#   GoatCounter: goatcounter.com で作ったサブドメイン名だけを入れる
# --------------------------------------------------------------------------
analytics:
  # ビーコントークンはページのHTMLに出る=公開前提の値なので、ここに書いてよい
  # (Webhook やアフィリIDと違い秘密ではない)。
  cloudflare_token: "20dcbfff930e41eb9f78a128866a2242"
  goatcounter_code: ""

# --------------------------------------------------------------------------
# アフィリエイト
#
# ID は環境変数が優先される（JPGATE_EBAY_CAMPAIGN_ID / JPGATE_AMAZON_US_TAG）。
# **空のあいだリンクは1本も生成されない。** 審査に通る前にリンクを出すと
# 規約違反になるので、既定は空。
#
# eBay Partner Network も Amazon アソシエイトも、**審査に実在するサイトが要る**。
# 順序は「公開 → 記事が溜まる → 申請 → IDを入れる」で、逆はできない。
# Amazon は登録後180日以内に売上が無いとアカウントが閉じるので、
# 流入が出てから申請すること。
# --------------------------------------------------------------------------
affiliate:
  ebay_campaign_id: ""
  amazon_us_tag: ""

sources:
  - name: p-bandai

    # ------------------------------------------------------------------
    # ソース単位のゲート宣言。
    #
    # evidence と verified_on は必須。根拠を書けないものは宣言できない。
    # サイトのポリシーは変わるので、確認日が古くなったら doctor が警告する。
    # ------------------------------------------------------------------
    gates:
      - key: G2_JP_ADDRESS
        evidence: >-
          p-bandai.jp の配送先は日本国内のみ。決済・配送先の選択に
          海外住所の選択肢が存在しない。海外向けは別サイト
          (Premium Bandai USA/Asia) で品揃えが異なる。
        verified_on: 2026-08-17

    per_page: 20
    delay_sec: 1.5
    timeout: 60

    # ------------------------------------------------------------------
    # 走査対象。
    #
    # URL は https://p-bandai.jp/<shop>/list-da<per_page>-n<offset>/ 。
    # 存在しないショップ名を書くとトップページが返るが、パーサ側で
    # 弾いて ok=False にするので黙って0件にはならない。
    #
    # 一覧の既定の並びは新着順なので、先頭数ページで当日ぶんは拾える。
    # 取りこぼしが怖いショップは max_pages を上げる。
    #
    # ショップ直下に一覧が無い店(gundambase 等)は、カテゴリまで含めた
    # パスを shop に書く。URL の組み立ては同じなのでそれで通る。
    # ------------------------------------------------------------------
    shops:
      - shop: tamashiiwebshouten
        label: "Tamashii Web Shop"
        max_pages: 6
      - shop: hobby
        label: "Hobby (Gunpla / Model Kits)"
        max_pages: 5
      - shop: carddas
        label: "Carddass"
        max_pages: 3

      # ガンダムベース。**抽選販売の密度がここだけ突出している**
      # (2026-08-19 実測: 新着1ページ20件中17件が抽選販売)。
      # 抽選は海外から応募できない = 最も強い関門なので、単価以上に価値がある。
      #
      # a0004(作品別) は足さないこと。a0001 と同じ商品を別の軸で並べた
      # ものにすぎず、実測で40件中34件が重複した。取得が倍になるだけ。
      - shop: gundambase/a0001
        label: "Gundam Base (Gunpla)"
        max_pages: 5
      # 周辺アイテム。a0001 とは重複0件、単価は低い(中央値¥1,650)。
      - shop: gundambase/a0002
        label: "Gundam Base (Goods)"
        max_pages: 2

  # --------------------------------------------------------------------------
  # ポケモンセンターオンライン
  #
  # robots.txt は全面許可。**正直なUAで200が返る**ので騙らない。
  # カテゴリURLがそのまま一覧になり、一覧は sitemap_0.xml に98件ある。
  #
  # **在庫状態が一覧から取れない**（tagList は常に空で、在庫フラグは商品ページ
  # にしか無い）。よって全品 LISTED = 在庫不明 で登録し、検知できるのは
  # 「掲載が新しく現れた」= 新商品/発売開始 だけ。再販・売り切れは観測できない。
  # shop はサイトマップに実在するカテゴリパスのみを書くこと（推測で書くと404）。
  # --------------------------------------------------------------------------
  - name: pokemon-center

    gates:
      - key: G2_JP_ADDRESS
        evidence: >-
          ポケモンセンターオンラインは日本国内の住所にのみ配送する。
          海外発送の選択肢が決済画面に存在せず、海外向けの公式窓口は
          Pokémon Center US など別サイトで品揃えが異なる。
        verified_on: 2026-08-18

    per_page: 48
    delay_sec: 1.5
    timeout: 60

    shops:
      - shop: plush-toys/plush
        label: "Plush"
        max_pages: 3
      - shop: plush-toys/figures
        label: "Figures"
        max_pages: 2
      - shop: pokemon-card-game/booster-packs
        label: "TCG Booster Packs"
        max_pages: 2
      - shop: pokemon-card-game/tcg-expansions
        label: "TCG Expansions"
        max_pages: 2
      - shop: zakka/keychains-pins
        label: "Keychains & Pins"
        max_pages: 2
      - shop: season-feature/pickup
        label: "Seasonal Pickup"
        max_pages: 2

notify:
  # 1回の実行でDiscordに投げる上限。誤検知が爆発したときの被害を切る。
  max_per_run: 20
  # 用語集での訳出率がこれ未満なら「原題のまま」と注記する。
  min_translation_coverage: 0.5

clip:
  # 1本の動画に入れる商品数。5件で35秒前後。増やすと最後まで見られなくなる。
  max_items: 5

output:
  db: data/jpgate.sqlite
  # GitHub Pages を main ブランチの /docs から配信するため docs 固定。
  site_dir: docs
  glossary: data/glossary.yaml
  # 「終了」欄の掲載数。古いものを載せ続けると二次流通にも無い商品が並ぶ。
  closed_limit: 60
  # 生成した縦動画の置き場（git には入れない）。
  clip_dir: data/clips
